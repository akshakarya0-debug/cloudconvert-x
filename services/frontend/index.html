<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudConvert-X</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mut:#6b7686;--bd:#dde2ea;--pri:#2f6fed;--ok:#1a9d5c;--err:#d23f3f}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--tx:#e6eaf0;--mut:#93a0b2;--bd:#2b3441;--pri:#5b8def;--ok:#3dcc8a;--err:#ff6b6b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
  main{max-width:820px;margin:0 auto;padding:24px 16px 64px}
  h1{margin:0 0 4px;font-size:26px} .sub{color:var(--mut);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
  #drop{border:2px dashed var(--bd);border-radius:12px;padding:32px;text-align:center;cursor:pointer;color:var(--mut)}
  #drop.over{border-color:var(--pri);color:var(--pri)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  select,button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
  button.primary{background:var(--pri);border-color:var(--pri);color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--bd)}
  .chip.ok{color:var(--ok);border-color:var(--ok)} .chip.bad{color:var(--err);border-color:var(--err)}
  .job{border-top:1px solid var(--bd);padding:12px 0} .job:first-child{border-top:0}
  .bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--pri);transition:width .3s}
  .meta{color:var(--mut);font-size:13px} .err{color:var(--err)}
  a.dl{color:var(--pri);font-weight:600;text-decoration:none}
  h2{font-size:16px;margin:0 0 10px}
</style>
</head>
<body>
<main>
  <h1>CloudConvert-X</h1>
  <p class="sub">Konversi dokumen, gambar, audio, dan video. Dikerjakan layanan Python, Node.js, dan Go.</p>

  <div class="card">
    <h2>Status layanan</h2>
    <div class="chips" id="health">memuat...</div>
  </div>

  <div class="card">
    <div id="drop">Tarik file ke sini atau klik untuk memilih</div>
    <input type="file" id="file" hidden>
    <div class="row">
      <span id="fname" class="meta">Belum ada file</span>
    </div>
    <div class="row">
      <label for="target">Ubah ke:</label>
      <select id="target" disabled></select>
      <button id="go" class="primary" disabled>Konversi</button>
    </div>
    <div id="msg" class="meta" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>Riwayat</h2>
    <div id="jobs"><span class="meta">Belum ada job</span></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let formats = {}, file = null;

const extOf = (n) => (n.includes('.') ? n.split('.').pop().toLowerCase() : '');
const categoryOf = (ext) => Object.entries(formats).find(([, v]) => v.input.includes(ext))?.[0];

async function loadFormats() {
  formats = (await (await fetch('/api/formats')).json()).categories;
}

function pick(f) {
  file = f;
  $('#fname').textContent = f ? `${f.name} (${(f.size / 1048576).toFixed(2)} MB)` : 'Belum ada file';
  const sel = $('#target'); sel.innerHTML = '';
  const cat = f && categoryOf(extOf(f.name));
  if (!cat) {
    $('#msg').textContent = f ? `Format .${extOf(f.name)} belum didukung` : '';
    sel.disabled = true; $('#go').disabled = true; return;
  }
  formats[cat].output.filter((o) => o !== extOf(f.name)).forEach((o) => sel.add(new Option(o.toUpperCase(), o)));
  $('#msg').textContent = `Kategori: ${cat}`;
  sel.disabled = false; $('#go').disabled = false;
}

const drop = $('#drop');
drop.onclick = () => $('#file').click();
$('#file').onchange = (e) => pick(e.target.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };

$('#go').onclick = async () => {
  const fd = new FormData();
  fd.append('file', file); fd.append('target', $('#target').value);
  $('#go').disabled = true; $('#msg').textContent = 'Mengunggah...';
  try {
    const res = await fetch('/api/jobs', { method: 'POST', body: fd });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || res.status);
    $('#msg').textContent = `Job ${body.job_id.slice(0, 8)} masuk antrean ${body.queue}`;
    refreshJobs();
  } catch (e) { $('#msg').textContent = 'Gagal: ' + e.message; }
  $('#go').disabled = false;
};

async function refreshJobs() {
  try {
    const jobs = await (await fetch('/api/jobs')).json();
    const box = $('#jobs');
    if (!jobs.length) return;
    box.innerHTML = jobs.map((j) => `
      <div class="job">
        <b>${j.filename}</b> → ${String(j.target).toUpperCase()}
        <span class="meta"> · ${j.status}${j.worker ? ' · ' + j.worker : ''}</span>
        ${j.status === 'done' ? `<div><a class="dl" href="/api/jobs/${j.job_id}/download">Unduh ${j.output_name}</a></div>` : ''}
        ${j.status === 'failed' ? `<div class="err">${j.error || 'gagal'}</div>` : ''}
        ${j.status === 'processing' || j.status === 'queued' ? `<div class="bar"><i style="width:${j.progress}%"></i></div>` : ''}
      </div>`).join('');
  } catch (_) {}
}

async function refreshHealth() {
  const box = $('#health');
  try {
    const h = await (await fetch('/api/health')).json();
    const chip = (label, ok) => `<span class="chip ${ok ? 'ok' : 'bad'}">${label}</span>`;
    let html = chip('API · Python', true);
    for (const [k, v] of Object.entries(h.services)) html += chip(`${k} · ${v === 'ok' ? 'ok' : 'down'}`, v === 'ok');
    html += h.workers.length
      ? h.workers.map((w) => chip(`${w.service} · ${w.language}`, true)).join('')
      : chip('belum ada worker aktif', false);
    box.innerHTML = html;
  } catch (_) { box.innerHTML = '<span class="chip bad">API tidak terjangkau</span>'; }
}

loadFormats(); refreshHealth(); refreshJobs();
setInterval(refreshJobs, 1000);
setInterval(refreshHealth, 5000);
</script>
</body>
</html>
